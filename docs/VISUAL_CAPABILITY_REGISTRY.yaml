# V5 Phase 2B — Visualization Capability Registry
#
# REFACTOR_V5_PLAN.md §9 의 SSOT. 차트 type 의 *capability bound* 를 명시한다.
# Phase 2 의 "open-ended charts" 표현을 *capability-bounded* 로 정정.
#
# [정책 — Plan §9.4 의 3-tier]
#   safe         : VisualPlanner 가 자유롭게 emit. ChartCritic 통과는 여전히 필요.
#   guarded      : ChartCritic 통과 + Visual Sanity (Phase 6 Gate C) 통과 필수.
#                  실패율이 safe 대비 높을 것으로 예상.
#   experimental : 기본값 forbidden. ResearchDirector (Phase 1A) 의 must_have 또는
#                  사용자 명시 요청 시에만 허용.
#
# [renderer 라벨]
#   vega_lite             : Plan §7 의 단일 어댑터 (src/visual/vega_adapter.py).
#   d3_custom             : 별도 d3 SVG 코드 (sankey/network 등 — Vega-Lite 미지원).
#   vega_lite_or_d3_geo   : Vega-Lite 의 geo encoding + d3-geo 보조.
#   vega_lite_or_d3_custom: 둘 중 하나 선택 가능 (treemap 등).
#
# [추가 절차 — Plan §9.5 인수 기준]
#   1. 새 차트 type 추가 시 본 yaml 에 항목 신설 (PR 체크리스트 강제).
#   2. src/visual/capability_registry.py 의 캐시는 자동 갱신.
#   3. tests/regression/test_capability_registry.py 의 분포 가드 갱신.
#
# [필드 정의]
#   renderer        : 위 4종 enum 중 하나
#   status          : safe / guarded / experimental
#   required_fields : 차트 emit 시 EvidenceDataset 의 필드명 세트가 *최소* 만족해야 할 항목
#   default_policy  : (experimental 만) 'forbidden' 이 디폴트
#   notes           : 운영 메모 (참고용)
#   added_in        : V5 의 어느 Phase 에서 도입되었는지

visual_capabilities:

  # ─── Tier — safe (10종): 안정적, VisualPlanner 자유 emit ───────────────

  bar:
    renderer: vega_lite
    status: safe
    required_fields: [category, value]
    added_in: phase_2

  line:
    renderer: vega_lite
    status: safe
    required_fields: [time, value]
    added_in: phase_2

  area:
    renderer: vega_lite
    status: safe
    required_fields: [time, value]
    added_in: phase_2

  stacked_bar:
    renderer: vega_lite
    status: safe
    required_fields: [category, segment, value]
    added_in: phase_2

  heatmap:
    renderer: vega_lite
    status: safe
    required_fields: [x_category, y_category, value]
    added_in: phase_2

  bubble:
    renderer: vega_lite
    status: safe
    required_fields: [x, y, size]
    added_in: phase_2

  donut:
    renderer: vega_lite
    status: safe
    required_fields: [category, value]
    added_in: phase_2

  forecast:
    renderer: vega_lite
    status: safe
    required_fields: [time, actual, forecast, ci_low, ci_high]
    added_in: phase_2

  dual_line:
    renderer: vega_lite
    status: safe
    required_fields: [time, left_value, right_value]
    added_in: phase_2

  gantt:
    renderer: vega_lite
    status: safe
    required_fields: [task, start, end]
    added_in: phase_2
    notes: "v4.5.4 의 시간축 자동 추가 정책 (CHART-AP-13) 보존."

  decision_matrix:
    renderer: vega_lite
    status: safe
    required_fields: [option, criterion, score]
    added_in: phase_2
    notes: "Phase 8 전략 모드 필수 시각화. heatmap-style 또는 점수표."

  # ─── Tier — guarded (3종): Phase 6 Gate C 강제 ─────────────────────────

  choropleth:
    renderer: vega_lite_or_d3_geo
    status: guarded
    required_fields: [geo_id, value]
    added_in: phase_2
    notes: "TopoJSON 베이스맵 의존. Phase 6 Visual Sanity 강제."

  # network (행위자 관계도) 는 v7.9.17 에서 폐기 (CHART-AP-37) — 정보 밀도 대비
  # 공간 점유 과다. validate_chart_data 가 drop, RENDERERS 미등록.

  sankey:
    renderer: d3_custom
    status: guarded
    required_fields: [source, target, value]
    added_in: phase_2
    notes: "d3-sankey plugin. 노드 수 ≤ 12 권장 (시각 피로 차단)."

  # ─── v5.2.14 신규 7종 (FT/Economist 스타일) ──────────────────────────
  # 도입 시점에는 모두 guarded — 회귀 데이터 (Layer 1 telemetry) 충분히
  # 축적되고 chart_critic 통과율 측정 후 safe 승격 가능.
  # 모두 d3_custom (Vega-Lite 직접 지원 미흡 또는 라벨/주석 제어 필요).

  scatter:
    renderer: d3_custom
    status: guarded
    required_fields: [label, x, y]
    added_in: v5_2_14
    notes: "라벨 산점도 (FT 좌측 스타일). bubble 과 구분 — size 인코딩 없음."

  stacked_area:
    renderer: d3_custom
    status: guarded
    required_fields: [series_name, time, value]
    added_in: v5_2_14
    notes: "시계열 점유율 변화 (FT 우측 스타일). ≤5 시리즈, 각 ≥5 포인트."

  lollipop:
    renderer: d3_custom
    status: guarded
    required_fields: [label, value]
    added_in: v5_2_14
    notes: "bar 의 우아한 대안. 8-15 항목 (그 미만은 bar 가 적절)."

  slope:
    renderer: d3_custom
    status: guarded
    required_fields: [label, value_a, value_b]
    added_in: v5_2_14
    notes: "2 시점 비교, 순위 역전. 3-10 항목."

  small_multiples:
    renderer: d3_custom
    status: guarded
    required_fields: [panel_label, x, y]
    added_in: v5_2_14
    notes: "4-9 panel × 각 ≥5 포인트. 같은 구조 반복 비교."

  waterfall:
    renderer: d3_custom
    status: guarded
    required_fields: [label, value, type]
    added_in: v5_2_14
    notes: "증감 분해 (P&L brücke). 첫·끝 row type='total' 강제."

  range_bar:
    renderer: d3_custom
    status: guarded
    required_fields: [label, low, high]
    added_in: v5_2_14
    notes: "Dumbbell — low<high 강제, 3-15 항목."

  # ─── v7.0.0 Track A 신규 3종 (REFACTOR_V7_PLAN.md §1.3) ─────────────────

  bump:
    renderer: d3_custom
    status: guarded
    required_fields: [periods, items]
    added_in: v7_0_0
    notes: "시기별 순위 경쟁 — 2-6 시기 × 3-8 항목, ranks 격자 정합 강제. slope(2시점)·line(값 축)과 구분."

  bullet:
    renderer: d3_custom
    status: guarded
    required_fields: [label, value, target]
    added_in: v7_0_0
    notes: "목표 대비 실적 — 1-7행, target>0 강제. 실적 vs 가이던스/컨센서스 중첩은 bar 가 아니라 본 type."

  connected_scatter:
    renderer: d3_custom
    status: guarded
    required_fields: [x, y]
    added_in: v7_0_0
    notes: "2변수 시간 경로(궤적) — 시간 순서 4-30점. dual_line(두 축 분리)과 구분, 금리×환율 류."

  # ─── v7.5.0 신규 4종 (이중 축 결합 + 사회 이슈 어휘) ─────────────────────
  # 도입 시점 guarded — chart_critic 통과율 측정 후 safe 승격 검토 (v5.2.14 와
  # 동일 정책). 모두 d3_custom.

  combo:
    renderer: d3_custom
    status: guarded
    required_fields: [bars, line]
    added_in: v7_5_0
    notes: "이중 축 막대+선 — 부피·건수(막대, 좌축) × 수준(선, 우축). dual_line(선×선)과 구분. 막대 3-60."

  diverging_bar:
    renderer: d3_custom
    status: guarded
    required_fields: [label, neg, pos]
    added_in: v7_5_0
    notes: "대립 쌍 발산 막대 (사회 이슈·여론) — 찬/반·유입/유출. neg/pos 양수 magnitude, 2-15행."

  pyramid:
    renderer: d3_custom
    status: guarded
    required_fields: [bracket, left, right]
    added_in: v7_5_0
    notes: "인구 피라미드 — 연령대 × 두 집단. 4-25행, 입력 순서 = 젊은층부터."

  dot_matrix:
    renderer: d3_custom
    status: guarded
    required_fields: [label, value]
    added_in: v7_5_0
    notes: "100칸 와플/아이소타입 — '100명 중 N명' 사회 통계 체감. 2-6 segment, largest-remainder 정규화."

  stakeholder_map:
    renderer: d3_custom
    status: guarded
    required_fields: [nodes, edges]
    added_in: v8_0_0
    notes: "르포 전용 행위자 관계도. 진영(col) 칼럼 결정적 배치 — force/hairball 금지(CHART-AP-36). 국기/인물/로고 자산 sprite 분리. report_format=reportage 한정."

  # ─── Tier — experimental (2종): 기본 forbidden, must_have 시만 ─────────

  chord:
    renderer: d3_custom
    status: experimental
    default_policy: forbidden
    required_fields: [source, target, value]
    added_in: phase_2
    notes: "ResearchDirector 의 must_have 에 명시 등재 시에만 허용."

  treemap:
    renderer: vega_lite_or_d3_custom
    status: experimental
    default_policy: forbidden
    required_fields: [hierarchy, value]
    added_in: phase_2
    notes: "계층 데이터에 적합 — 일반 사건엔 거의 부적합."

# ─── 사용 — capability_registry.py 가 본 yaml 을 로드 ─────────────────────
#
#   from src.visual.capability_registry import (
#       load_registry,
#       get_capability,
#       is_chart_type_allowed,
#       check_required_fields,
#       list_safe_types,
#       list_guarded_types,
#       list_experimental_types,
#   )
#
# AP-V5-27 — Capability Registry 미등재 차트 emit 금지. VisualPlanner 가
# emit 시 본 Registry 외 type 을 박으면 즉시 drop.

# ─── 분포 (test_capability_registry 가 자동 검증) ─────────────────────────
distribution:
  safe:         11
  guarded:      17   # v7.9.17: network 폐기(CHART-AP-37). 2 (choropleth/sankey) + 7 (scatter/stacked_area/lollipop/slope/small_multiples/waterfall/range_bar) + v7.0.0: 3 (bump/bullet/connected_scatter) + v7.5.0: 4 (combo/diverging_bar/pyramid/dot_matrix) + v8.0.0: 1 (stakeholder_map)
  experimental: 2
total: 30
