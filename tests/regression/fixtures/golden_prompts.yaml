    expected:
      mode: deep
      section_count_range: [5, 7]
      required_evidence_types: [primary, secondary]
      forbidden_chart_types: [donut]
      required_map_behavior:
        must_have_map: true
        forbidden_map: false
        forbidden_geo_annotations: [Somaliland]
      min_total_chars: 6000
      must_have_contradictions: true
      must_have_watch_signals: true
