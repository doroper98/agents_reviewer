# Golden Prompt Set — REFACTOR_V5_PLAN.md Phase 0B (§3.3)
#
# 20 prompts × 8 categories. 본 fixture 는 V5 의 모든 후속 변경이 v4.5.x baseline
# 보다 *어떻게* 다른지 결정적으로 측정하는 회귀 하네스의 입력. expected metadata 는
# Plan 의 §3.4 (가) Golden Prompt Regression 의 5종 (mode / section_count_range /
# required_evidence_types / forbidden_chart_types / required_map_behavior) + 추가
# (V5 Phase 1A 의 expected_method, Phase 8 의 strategic_intent) 항목을 포함한다.
#
# 항목 의미:
#   id                       — 카테고리 + 일련번호. 회귀 테스트 결과 추적용.
#   category                 — 8개 카테고리 라벨. test_golden_prompts.py 가 분포 검증.
#   prompt                   — 사용자 메시지 그대로. 텔레그램으로 전송한다고 가정.
#   expected:
#     mode                   — fast / standard / deep. resolve_mode() 가 prompt 에서
#                              자동 결정해야 하는 값.
#     section_count_range    — [min, max]. composer 산출 보고서의 섹션 수 허용 범위.
#                              fast 3~4, standard 4~6, deep 5~7 의 가이드 안에서
#                              주제별로 좁혀 박는다.
#     required_evidence_types — 보고서가 *반드시* 인용해야 할 출처 종류
#                              (primary / secondary / expert / model_inference).
#                              '최소 1개 이상 등장' 의미.
#     forbidden_chart_types  — 본 사건에 *부적합한* 차트 type 목록. composer 가
#                              emit 한 차트에 포함되면 회귀 fail (CHART-AP-8 회귀).
#     required_map_behavior:
#       must_have_map        — true 면 embedded_map 필수. false 면 강제 X.
#       forbidden_map        — true 면 embedded_map 절대 emit 금지 (지리 무관 사건).
#       forbidden_geo_annotations — 본문이 다루지 않는 지리 라벨 목록 (CHART-AP-14).
#                              예: 호르무즈 보고서에 'Somaliland' 가 들어 있으면 fail.
#     min_total_chars        — 보고서 본문 (모든 섹션 prose 합산) 최소 자수.
#                              Completeness Regression 의 절단 검출 임계.
#     must_have_contradictions — true 면 contradictions 비어있으면 fail (deep 모드 권장).
#     must_have_watch_signals  — true 면 watch_signals 비어있으면 fail.
#     # V5 Phase 1A 검증용 (현재 Phase 0B 시점 — 미사용, V5 진입 시 활성화)
#     expected_method        — ResearchDirector 가 선택해야 하는 분석기법 (9종).
#                              Phase 1A 진입 전엔 informational only.
#     # V5 Phase 8 검증용 (Phase 0B 시점 — strategic 카테고리만 활성)
#     strategic_intent       — true 면 strategic mode 라우팅이어야 함 (전략 질의형).
#
# 카테고리 분포 (Plan §3.3):
#   geopolitical_forecast        : 3건
#   financial_transmission       : 3건
#   tech_structural              : 3건
#   policy_decision              : 2건
#   strategic_query              : 3건  (V5 Phase 8 검증)
#   map_required                 : 2건
#   no_charts                    : 2건
#   long_deep_truncation         : 2건
# 총                             : 20건

prompts:

  # ─── 1. 지정학 예측형 (3건) ─────────────────────────────────────────
